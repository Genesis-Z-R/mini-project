version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: estudy_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: estudywebapprootpassword
      MYSQL_DATABASE: estudy_db
      MYSQL_USER: estudy
      MYSQL_PASSWORD: estudywebapppassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
